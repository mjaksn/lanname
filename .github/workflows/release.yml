name: Release

# Tags only. Nothing here fires on a branch, so publishing is always a
# deliberate act with a version number attached to it.
#
# Publishing goes through a trusted publisher registered on PyPI: a GitHub
# publisher naming this repository, this workflow file, and the environment
# below. It exchanges a short-lived OIDC token at publish time, so there is no
# API token living in the repository secrets to leak or to rotate.
#
# Nothing is registered yet, because nothing has been published yet. Before the
# first tag is pushed, add a *pending* publisher from the publishing page of
# the PyPI account: there is no project to attach an ordinary one to until
# something has been uploaded, and the first upload is the one that needs it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The check below walks the history, and the shallow fetch that
          # checkout does by default has none to walk.
          fetch-depth: 0
      - name: the tag must be on main
        # A squash merge writes a commit of its own, so a tag put on the
        # branch before the merge names a commit that never reaches main.
        # What was published is still fine, but the history stops saying so:
        # `git describe` on main answers with the release before this one, and
        # the release reads as though it never happened. Merge first, then tag
        # the commit that landed.
        run: |
          git fetch --no-tags --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
            echo "::error::$GITHUB_REF_NAME is not on main; merge first, then tag the commit that landed"
            exit 1
          }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: the tag and the version must agree
        # A tag that disagrees with pyproject.toml (or the package's own
        # __version__) publishes something nobody can find again. Cheaper to
        # fail here than to yank a release.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          pkg_version="$(python -c 'import lanname; print(lanname.__version__)')"
          echo "tag $tag, pyproject $version, __version__ $pkg_version"
          [ "$tag" = "$version" ] || {
            echo "::error::tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          }
          [ "$tag" = "$pkg_version" ] || {
            echo "::error::tag $GITHUB_REF_NAME does not match lanname.__version__ $pkg_version"
            exit 1
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: distributions
          path: dist/

  publish:
    name: publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # the OIDC token trusted publishing exchanges
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  release:
    name: create the GitHub release
    needs: [publish]
    runs-on: ubuntu-latest
    # The only job here that writes back to the repository, and the only one
    # with no use for the OIDC token the publish above exchanges. Kept apart so
    # that neither holds a permission the other needs.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the notes come from the changelog
        # A release page written by hand would be a second account of a release
        # that CHANGELOG.md already gives, free to drift from it. The section
        # for the tag is lifted out instead, so there is one account and the
        # release page quotes it.
        #
        # A tag the changelog says nothing about fails here rather than
        # publishing an empty page, for the reason the version check above
        # fails: cheaper than editing a release after the fact.
        #
        # The heading itself is left behind. The title below already carries
        # the version, and the heading is a reference style link whose
        # definition sits at the foot of the changelog, so lifted out on its
        # own it would render as bare brackets.
        run: |
          python3 - <<'PY' > notes.md
          import os, pathlib, re, sys
          version = os.environ["GITHUB_REF_NAME"][1:]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          found = re.search(
              r"(?ms)^## \[%s\][^\n]*\n(.*?)(?=^## \[|^\[[0-9])"
              % re.escape(version),
              text)
          if found is None or not found.group(1).strip():
              raise SystemExit("CHANGELOG.md has no section for %s" % version)
          sys.stdout.write(found.group(1).strip() + "\n")
          PY
      - name: create the release
        # gh rather than an action, because the runner already has it and the
        # token it needs is the one the job was given. Nothing new to pin.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "lanname ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --verify-tag
